# Egress allowlist for runner containers.
#
# Filtering is by TLS SNI with peek+splice, NOT by CONNECT host and NOT by MITM.
# That matters for two reasons: no certificate has to be injected into any
# client, and the filter still applies to runtimes that ignore HTTP_PROXY.
# Node/undici -- which is what the OpenCode harness speaks HTTP through -- is
# exactly such a runtime, so an env-var-only proxy would fence Python while
# leaving the coding agent with open internet.
#
# Runners reach this process by having their default route pointed at the
# gateway container (runner/entrypoint.py::configure_egress_route); the
# ce-internal network they sit on has no other way off the host.

http_port 3128
http_port 3129 intercept
https_port 3130 intercept ssl-bump name=tlsintercept \
    cert=/etc/squid/ssl/squid.pem \
    generate-host-certificates=off

# Providers actually used by the benchmark configs.
acl allowed_sni ssl::server_name .anthropic.com
acl allowed_sni ssl::server_name .openai.com
acl allowed_sni ssl::server_name .deepinfra.com
acl allowed_sni ssl::server_name .gmi-serving.com
# DeepSeek's first-party API. The seed programs pin one model
# (DeepSeek-V4-Flash) served by a ranked list of providers -- gmi, deepseek,
# deepinfra -- and divert a failed call to the next one down. Every wired
# benchmark (appworld and alfworld included) is on that chain and preflight
# requires this host globally, so a squid.conf without this line aborts every
# run on the host at startup.
acl allowed_sni ssl::server_name .deepseek.com
# ALFWorld's task model (Qwen 3.6 35B-A3B) routes through OpenRouter -- direct
# DeepInfra latency (median 61s/call) made a 30-row subsample take ~3h.
acl allowed_sni ssl::server_name .openrouter.ai
# Hosted ColBERT retrieval for hover and phantom-wiki.
acl allowed_sni ssl::server_name .modal.run
# Package installs: LocalEnvironment re-runs `uv pip install` on every start,
# and agents legitimately add dependencies.
acl allowed_sni ssl::server_name .pypi.org
acl allowed_sni ssl::server_name .pythonhosted.org
acl allowed_sni ssl::server_name .npmjs.org
acl allowed_sni ssl::server_name .nodejs.org
# OpenCode fetches its model catalogue from models.dev/api.json at session
# start. Blocking it does not degrade the harness, it kills it: every session
# exits 1 with "Unexpected server error", the optimizer records a skipped
# iteration, and the loop burns its whole iteration cap at ~5s each having
# spent zero eval budget. A static catalogue of model ids -- no benchmark data
# can arrive through it.
acl allowed_sni ssl::server_name .models.dev

acl allowed_host dstdomain .anthropic.com .openai.com .deepinfra.com
acl allowed_host dstdomain .gmi-serving.com .deepseek.com .modal.run .openrouter.ai
acl allowed_host dstdomain .pypi.org .pythonhosted.org .npmjs.org .nodejs.org
acl allowed_host dstdomain .models.dev

acl CONNECT method CONNECT
acl SSL_ports port 443
acl Safe_ports port 80 443
acl intercepted_tls myportname tlsintercept
acl step1 at_step SslBump1

# THE ENFORCEMENT POINT for intercepted TLS is ssl_bump, not http_access.
#
# An intercepted connection arrives as a synthetic CONNECT built from the
# destination IP, and http_access runs on it BEFORE anything has been peeked --
# at which point `ssl::server_name` has no SNI to match and an allowlist there
# denies every connection, allowed or not. Squid then answers with its own
# self-signed cert, so the client sees a certificate error rather than a clean
# block and NOTHING is ever spliced. Deciding in ssl_bump instead runs the
# match at step 2, where the ClientHello has been read:
#
#   peek step1     -> read the ClientHello, learn the SNI, decrypt nothing
#   splice matched -> hand the connection through untouched; the client
#                     completes TLS against the ORIGIN's real certificate
#   terminate all  -> everything else is cut off before a session exists
ssl_bump peek step1
ssl_bump splice allowed_sni
ssl_bump terminate all

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
# Let intercepted TLS reach ssl_bump; the rules above are what allow or cut it.
http_access allow intercepted_tls
# Plain HTTP (port 80 -> 3129) and the explicit-proxy port have no SNI, so they
# stay filtered by hostname here.
http_access allow allowed_sni
http_access allow allowed_host
http_access deny all

# The access log is a run artifact: a machine-checkable record that no agent
# contacted github.com. Stronger evidence than a post-hoc audit.
logformat ce %ts.%03tu %>a %Ss/%03>Hs %<st %rm %ru %ssl::>sni
access_log /var/log/squid/access.log ce
cache deny all
