# Headless Xorg config for GPU hosts (benchmarks with needs_gpu, i.e. the
# ALFWorld AI2-THOR/Unity renderer). provision.sh substitutes __NVIDIA_BUS_ID__
# with the PCI BusID derived from nvidia-smi on the host. Copied verbatim from
# the qualified cloud/alfworld-docker pipeline.
Section "ServerLayout"
    Identifier     "Layout0"
    Screen      0  "Screen0"
EndSection

Section "Monitor"
    Identifier     "Monitor0"
    VendorName     "Unknown"
    HorizSync       28.0 - 33.0
    VertRefresh     43.0 - 72.0
    Option         "DPMS"
EndSection

Section "Device"
    Identifier     "Device0"
    Driver         "nvidia"
    VendorName     "NVIDIA Corporation"
    BusID          "__NVIDIA_BUS_ID__"
    Option         "AllowEmptyInitialConfiguration" "True"
    Option         "UseDisplayDevice" "None"
EndSection

Section "Screen"
    Identifier     "Screen0"
    Device         "Device0"
    Monitor        "Monitor0"
    DefaultDepth    24
    SubSection     "Display"
        Depth       24
        Virtual     1280 1024
    EndSubSection
EndSection
