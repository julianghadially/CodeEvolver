[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeevolver-agents"
version = "1.0.0"
description = "Agentic optimization of AI system code against an evaluation dataset"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "motor>=3.6.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "pyjwt[cryptography]>=2.8.0",
    "cryptography>=41.0.0",
    "python-jose[cryptography]>=3.3.0",
    "svix>=1.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]
# Runtime deps the optimizer subprocess needs; they live in the operator's API
# venv (the Docker runner image installs them too). Install with:
# pip install -e .[local]
local = [
    "claude-agent-sdk>=0.1.60",
    "anyio>=4.0.0",
    "litellm>=1.64.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Put the repo root on sys.path so `from tests.<section>.X import ...` and
# `from tests._test_env import ...` resolve regardless of which section
# subfolder a test now lives in (tests/unit, tests/functional, ...).
pythonpath = ["."]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "live: marks opt-in tests that launch real external coding harnesses",
    "unit: marks tests as unit tests (fast, isolated component tests)",
    "functional: marks functional agent tests that exercise a real coding harness (claude/opencode)",
]
